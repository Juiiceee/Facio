name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify Swift
        run: swift --version

      - name: Validate shell scripts
        run: |
          bash -n scripts/build-app.sh
          bash -n scripts/create-dmg.sh

      - name: Build
        run: swift build

      - name: Packaging smoke test
        run: |
          VERSION="0.0.0"

          if ./scripts/build-app.sh "1.2.3-rc.1"; then
            echo "build-app.sh accepted a prerelease version" >&2
            exit 1
          fi

          ALLOW_AD_HOC_SIGNING=1 ./scripts/build-app.sh "$VERSION"
          ./scripts/create-dmg.sh "$VERSION"

          ARCH="$(uname -m)"
          DMG_PATH="dist/Facio-${VERSION}-macos-${ARCH}.dmg"
          test -s "$DMG_PATH"
          test -s "${DMG_PATH}.sha256"
          shasum -a 256 -c "${DMG_PATH}.sha256"
