name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Security note: GitHub-hosted actions are pinned to immutable commit SHAs.
# Refresh intentionally with:
#   git ls-remote https://github.com/googleapis/release-please-action refs/tags/v4 refs/tags/v4^{}
#   git ls-remote https://github.com/actions/checkout refs/tags/v4 refs/tags/v4^{}

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify Swift
        run: swift --version

      - name: Validate release signing inputs
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          : "${CODESIGN_IDENTITY:?CODESIGN_IDENTITY secret is required}"
          : "${APPLE_DEVELOPER_ID_CERTIFICATE_BASE64:?APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 secret is required}"
          : "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:?APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD secret is required}"
          : "${KEYCHAIN_PASSWORD:?KEYCHAIN_PASSWORD secret is required}"
          : "${APPLE_ID:?APPLE_ID secret is required}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID secret is required}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?APPLE_APP_SPECIFIC_PASSWORD secret is required}"

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/facio-signing.keychain-db"

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Inject Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          escape_swift_string() {
            local value="$1"
            case "$value" in
              *$'\n'*|*$'\r'*)
                echo "Secrets must be single-line values" >&2
                return 1
                ;;
            esac
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '%s' "$value"
          }

          supabase_url="$(escape_swift_string "${SUPABASE_URL:?SUPABASE_URL secret is required}")"
          supabase_anon_key="$(escape_swift_string "${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY secret is required}")"

          {
            echo "// Auto-generated by CI. DO NOT EDIT."
            echo "enum SecretsGenerated {"
            printf '    static let supabaseURL = "%s"\n' "$supabase_url"
            printf '    static let supabaseAnonKey = "%s"\n' "$supabase_anon_key"
            echo "}"
          } > Facio/Config/SecretsGenerated.swift

      - name: Build .app
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          ./scripts/build-app.sh "$VERSION"

      - name: Create DMG
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARIZE: "1"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          ARCH="$(uname -m)"
          ./scripts/create-dmg.sh "$VERSION"
          printf 'DMG_NAME=Facio-%s-macos-%s.dmg\n' "$VERSION" "$ARCH" >> "$GITHUB_ENV"
          printf 'RELEASE_ARCH=%s\n' "$ARCH" >> "$GITHUB_ENV"

      - name: Create release provenance
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"
          DMG_PATH="dist/${DMG_NAME}"
          DMG_CHECKSUM_PATH="${DMG_PATH}.sha256"

          test -s "$DMG_PATH"
          test -s "$DMG_CHECKSUM_PATH"

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "commit=${GITHUB_SHA}"
            echo "artifact=${DMG_NAME}"
            echo "architecture=${RELEASE_ARCH}"
            echo "runner_os=${RUNNER_OS}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "dmg_sha256=$(awk '{print $1}' "$DMG_CHECKSUM_PATH")"
            swift --version | head -n 1 | sed 's/^/swift=/'
            xcodebuild -version | tr '\n' ' ' | sed 's/[[:space:]]*$//' | sed 's/^/xcode=/'
            echo
          } > "dist/Facio-${VERSION}-release-provenance.txt"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"

          gh release upload "$TAG" \
            "dist/${DMG_NAME}" \
            "dist/${DMG_NAME}.sha256" \
            "dist/Facio-${VERSION}-provenance.txt" \
            "dist/Facio-${VERSION}-release-provenance.txt" \
            --clobber
