name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Swift
        run: swift --version

      - name: Inject Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > Facio/Config/SecretsGenerated.swift <<SWIFT
          // Auto-generated by CI — DO NOT EDIT
          enum SecretsGenerated {
              static let supabaseURL = "${SUPABASE_URL}"
              static let supabaseAnonKey = "${SUPABASE_ANON_KEY}"
          }
          SWIFT

      - name: Build .app
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          ./scripts/build-app.sh "$VERSION"

      - name: Create DMG
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          DMG_NAME="Facio-${VERSION}.dmg"

          mkdir -p dmg-staging
          cp -r dist/Facio.app dmg-staging/
          ln -s /Applications dmg-staging/Applications

          hdiutil create -volname "Facio" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "dist/${DMG_NAME}"

          rm -rf dmg-staging
          echo "DMG_NAME=${DMG_NAME}" >> $GITHUB_ENV

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"

          cd dist
          zip -r "Facio-${VERSION}-mac.zip" Facio.app
          cd ..

          gh release upload "$TAG" \
            "dist/Facio-${VERSION}-mac.zip" \
            "dist/${DMG_NAME}" \
            --clobber
