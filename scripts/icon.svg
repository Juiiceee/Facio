<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Gradient fond -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7BA834"/>
      <stop offset="100%" stop-color="#4A6E1B"/>
    </linearGradient>
    <!-- Ombre douce -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <!-- Ombre document -->
    <filter id="docShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <!-- Gradient document -->
    <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F0"/>
    </linearGradient>
    <!-- Gradient bandeau vert -->
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B8E3A"/>
      <stop offset="100%" stop-color="#8BAE4A"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi style macOS -->
  <rect x="40" y="40" width="944" height="944" rx="210" ry="210" fill="url(#bgGrad)"/>

  <!-- Reflet subtil en haut -->
  <rect x="40" y="40" width="944" height="472" rx="210" ry="210" fill="white" opacity="0.08"/>

  <!-- Document principal (arriere) decale -->
  <g filter="url(#docShadow)" transform="translate(20, -10)">
    <rect x="260" y="195" width="500" height="650" rx="20" ry="20" fill="#E8E8E8" opacity="0.5"/>
  </g>

  <!-- Document principal -->
  <g filter="url(#docShadow)">
    <rect x="230" y="175" width="500" height="650" rx="20" ry="20" fill="url(#docGrad)"/>

    <!-- Bandeau vert en haut du document -->
    <rect x="230" y="175" width="500" height="80" rx="20" ry="20" fill="url(#headerGrad)"/>
    <rect x="230" y="225" width="500" height="30" fill="url(#headerGrad)"/>

    <!-- Titre dans le bandeau -->
    <text x="480" y="230" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-weight="700" font-size="32" fill="white" letter-spacing="1">FACTURE</text>

    <!-- Lignes de texte simulees -->
    <rect x="275" y="295" width="180" height="8" rx="4" fill="#B0B0B0" opacity="0.5"/>
    <rect x="275" y="315" width="120" height="8" rx="4" fill="#B0B0B0" opacity="0.4"/>

    <!-- Bloc destinataire -->
    <rect x="530" y="290" width="80" height="6" rx="3" fill="#6B8E3A" opacity="0.7"/>
    <rect x="530" y="305" width="140" height="8" rx="4" fill="#555" opacity="0.4"/>
    <rect x="530" y="323" width="100" height="7" rx="3" fill="#888" opacity="0.3"/>

    <!-- Tableau -->
    <!-- En-tete tableau -->
    <rect x="270" y="365" width="420" height="32" rx="6" ry="6" fill="#6B8E3A"/>
    <text x="295" y="387" font-family="Helvetica Neue, Helvetica" font-weight="600" font-size="14" fill="white">DESIGNATION</text>
    <text x="490" y="387" font-family="Helvetica Neue, Helvetica" font-weight="600" font-size="14" fill="white">QTE</text>
    <text x="550" y="387" font-family="Helvetica Neue, Helvetica" font-weight="600" font-size="14" fill="white">PRIX</text>
    <text x="630" y="387" font-family="Helvetica Neue, Helvetica" font-weight="600" font-size="14" fill="white">TOTAL</text>

    <!-- Ligne 1 -->
    <rect x="270" y="400" width="420" height="28" rx="0" fill="#F5F7F2" opacity="0.6"/>
    <rect x="285" y="410" width="130" height="7" rx="3" fill="#444" opacity="0.5"/>
    <rect x="495" y="410" width="30" height="7" rx="3" fill="#444" opacity="0.4"/>
    <rect x="555" y="410" width="35" height="7" rx="3" fill="#444" opacity="0.4"/>
    <rect x="630" y="410" width="45" height="7" rx="3" fill="#444" opacity="0.5"/>

    <!-- Ligne 2 -->
    <rect x="285" y="438" width="100" height="7" rx="3" fill="#444" opacity="0.5"/>
    <rect x="495" y="438" width="25" height="7" rx="3" fill="#444" opacity="0.4"/>
    <rect x="555" y="438" width="30" height="7" rx="3" fill="#444" opacity="0.4"/>
    <rect x="630" y="438" width="40" height="7" rx="3" fill="#444" opacity="0.5"/>

    <!-- Separateur -->
    <line x1="270" y1="462" x2="690" y2="462" stroke="#6B8E3A" stroke-width="1" opacity="0.4"/>

    <!-- Totaux -->
    <text x="590" y="490" text-anchor="end" font-family="Helvetica Neue, Helvetica" font-weight="400" font-size="14" fill="#555">TOTAL</text>
    <rect x="615" y="480" width="60" height="8" rx="3" fill="#555" opacity="0.4"/>

    <text x="590" y="515" text-anchor="end" font-family="Helvetica Neue, Helvetica" font-weight="400" font-size="14" fill="#555">TVA</text>
    <rect x="615" y="505" width="40" height="8" rx="3" fill="#555" opacity="0.3"/>

    <line x1="520" y1="525" x2="690" y2="525" stroke="#6B8E3A" stroke-width="1.5" opacity="0.5"/>

    <text x="565" y="550" text-anchor="end" font-family="Helvetica Neue, Helvetica" font-weight="700" font-size="16" fill="#333">Total TTC</text>
    <rect x="615" y="537" width="65" height="10" rx="4" fill="#6B8E3A" opacity="0.8"/>

    <!-- Pied de page avec barre verte -->
    <rect x="270" y="600" width="4" height="55" rx="2" fill="#6B8E3A"/>
    <rect x="285" y="605" width="100" height="7" rx="3" fill="#666" opacity="0.4"/>
    <rect x="285" y="620" width="80" height="6" rx="3" fill="#888" opacity="0.3"/>
    <rect x="285" y="635" width="110" height="6" rx="3" fill="#888" opacity="0.3"/>

    <!-- Info paiement droite -->
    <rect x="530" y="605" width="70" height="7" rx="3" fill="#666" opacity="0.4"/>
    <rect x="530" y="620" width="130" height="6" rx="3" fill="#888" opacity="0.25"/>
    <rect x="530" y="635" width="100" height="6" rx="3" fill="#888" opacity="0.25"/>
  </g>

  <!-- Cercles decoratifs (logo abstrait) en bas a droite -->
  <circle cx="780" cy="800" r="35" fill="#8B9E3C" opacity="0.6"/>
  <circle cx="815" cy="775" r="28" fill="#C4A839" opacity="0.5"/>
  <circle cx="795" cy="830" r="25" fill="#7B5EA7" opacity="0.5"/>
  <circle cx="830" cy="810" r="22" fill="#5A7A2B" opacity="0.55"/>

</svg>
